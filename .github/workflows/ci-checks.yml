name: CI checks

on:
  pull_request:
  push:
    branches: [ master ]

jobs:
  scan_ruby:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version

      # No bundler-cache — Brakeman's static analysis needs no app gems or bundle install.
      - name: Scan for common Rails security vulnerabilities using static analysis
        run: |
          gem install brakeman
          brakeman --no-pager

  scan_js:
    runs-on: ubuntu-24.04

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # CodeQL cannot read CoffeeScript, so compile it to JS next to the sources first.
      # Matches the coffee-script-source version Sprockets uses (see Gemfile.lock).
      - name: Compile CoffeeScript for analysis
        run: npx --yes -p coffee-script@1.12.2 coffee -c app

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          config: |
            # Only our own code; third-party libraries live in vendor/.
            paths:
              - app

      - name: Scan for common JavaScript security vulnerabilities using static analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
