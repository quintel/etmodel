version: v1.0
name: Deploy to stable
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2404

# Image tag and deploy path are derived from the branch name and must match the instance in the
# ansible stable group_vars:
# branch 2027-01 -> image quintel/etmodel:2027_01, deployed from /var/www/etmodel_2027_01.
#
# RELEASE is overwritten with "stable-<branch>" before the build: the Sentry release (runtime and
# uploaded source maps) is read from that file, and stable shares its Sentry project with latest.
blocks:
  - name: Docker
    task:
      prologue:
        commands:
          - chmod 0600 ~/.ssh/id_deploy
          - ssh-add ~/.ssh/id_deploy
      env_vars:
        - name: DOCKER_BUILDKIT
          value: '1'
        - name: BUNDLE_JOBS
          value: '4'
      jobs:
        - name: 'Build, publish, deploy'
          commands:
            - checkout
            - export TAG="${SEMAPHORE_GIT_BRANCH//-/_}"
            - echo "stable-$SEMAPHORE_GIT_BRANCH" > RELEASE
            - export SENTRY_RELEASE=$(cat RELEASE)
            - echo $DOCKERHUB_PASSWORD | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
            - 'docker build --progress plain -f Dockerfile.production --secret id=sentry_auth_token,env=SENTRY_AUTH_TOKEN --build-arg SENTRY_RELEASE=$SENTRY_RELEASE -t quintel/etmodel:$TAG .'
            - 'docker build -f .docker/nginx/Dockerfile -t quintel/etmodel-nginx:$TAG --build-arg "SOURCE_IMAGE=quintel/etmodel:$TAG" .'
            - 'docker push quintel/etmodel:$TAG'
            - 'docker push quintel/etmodel-nginx:$TAG'
            - echo $SSH_FINGERPRINT >> ~/.ssh/known_hosts
            - 'ssh -i ~/.ssh/id_deploy "${SSH_USER}@${SSH_HOST}" -p $SSH_PORT "cd /var/www/etmodel_$TAG && ./deploy.sh"'
      secrets:
        - name: Docker Hub credentials
        - name: Stable SSH settings
        - name: Sentry credentials
    run:
      when: >-
        branch = '2025-01' or
        branch = '2027-01'
