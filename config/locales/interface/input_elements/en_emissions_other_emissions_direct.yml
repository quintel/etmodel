---
en:
  input_elements:
    # Built environment
    emissions_households_non_specified_energetic_other_ghg:
      title: Households
      short_description: ''
      description: |
        During the combustion of fuels to heat households, methane (CH<sub>4</sub>) or nitrous oxide (N<sub>2</sub>O)
        can be emitted. This slider sets the amount of these emissions in the future year.
        <br/><br/> In the 'Common Reporting Tables (CRT)' developed by the UNFCCC these emissions are included in
        category: 1.A.4.b.
    emissions_buildings_non_specified_energetic_other_ghg:
      title: Buildings
      short_description: ''
      description: |
        During the combustion of fuels to heat buildings, methane (CH<sub>4</sub>) or nitrous oxide (N<sub>2</sub>O)
        can be emitted. This slider sets the amount of these emissions in the future year.
        <br/><br/> In the 'Common Reporting Tables (CRT)' developed by the UNFCCC these emissions are included in
        category: 1.A.4.a.
    # Transport
    emissions_transport_non_specified_energetic_other_ghg:
      title: National transport
      short_description: ''
      description: |
        During the combustion of fuels in the transport sector, methane (CH<sub>4</sub>) and nitrous
        oxide (N<sub>2</sub>O) are emitted. This slider sets the amount of these emissions in the future year.
        <br/><br/> In the 'Common Reporting Tables (CRT)' developed by the UNFCCC these emissions are included in
        category: 1.A.3 excl. 1.A.3.e.
    emissions_bunkers_international_aviation_energetic_other_ghg:
      title: International aviation
      short_description: ''
      description: |
        During the combustion of fuels in international aviation, methane (CH<sub>4</sub>) and nitrous
        oxide (N<sub>2</sub>O) are emitted. This slider sets the amount of these emissions in the future year.
        <br/><br/>
        <b>Note</b>: this slider only takes effect once the share of international aviation demand
        to be included in the scenario has been set in the
        <a href="/scenario/demand/transport_international_transport/international-transport">
        International transport</a> section. The same share is also applied to the other greenhouse gas
        emissions of international aviation that are set with this slider.
        <br/><br/>
        In the 'Common Reporting Tables (CRT)' developed by the UNFCCC these emissions are included in
        category: 1.D.1.a.
    emissions_bunkers_international_navigation_energetic_other_ghg:
      title: International navigation
      short_description: ''
      description: |
        During the combustion of fuels in international navigation, methane (CH<sub>4</sub>) and nitrous
        oxide (N<sub>2</sub>O) are emitted. This slider sets the amount of these emissions in the future year.
        <br/><br/>
        <b>Note</b>: this slider only takes effect once the share of international navigation demand
        to be included in the scenario has been set in the
        <a href="/scenario/demand/transport_international_transport/international-transport">
        International transport</a> section. The same share is also applied to the other greenhouse gas
        emissions of international navigation that are set with this slider.
        <br/><br/>
        In the 'Common Reporting Tables (CRT)' developed by the UNFCCC these emissions are included in
        category: 1.D.1.b.
    # Industry
    emissions_industry_aluminium_non_energetic_co2:
      title: Aluminium
      short_description: ''
      description: |
        During the production of aluminium CO<sub>2</sub> is emitted in non-energetic processes, mainly
        due to the consumption of carbon anodes. This slider sets the amount of these emissions in the future year.
        <br/><br/> In the 'Common Reporting Tables (CRT)' developed by the UNFCCC these emissions are included in
        category: 2.C.3.
    emissions_industry_aluminium_non_energetic_other_ghg:
      title: Aluminium
      short_description: ''
      description: |
        During the production of aluminium perfluorocarbons (PFCs) are emitted in non-energetic processes.
        This slider sets the amount of these emissions in the future year.
        <br/><br/> In the 'Common Reporting Tables (CRT)' developed by the UNFCCC these emissions are included in
        category: 2.C.3.
    emissions_industry_chemicals_non_energetic_co2:
      title: Chemicals
      short_description: ''
      description: |
        In the chemical industry there are different non-energetic processes in which CO<sub>2</sub>
        is emitted, for example in the production of petrochemical products and other chemical products.
        This slider sets the amount of these emissions in the future year.
        <br/><br/> In the 'Common Reporting Tables (CRT)' developed by the UNFCCC these emissions are included in
        category: 2.B excl. 2.B.1, 2.B.2, 2.B.8.a and 2.B.10.a.
    emissions_industry_chemicals_non_energetic_other_ghg:
      title: Chemicals
      short_description: ''
      description: |
        In the chemical industry there are many different non-energetic processes in which other
        greenhouse gases are emitted. For example, during the production of caprolactam, glyoxal,
        glyoxylic acid, and petrochemical products or fluorochemical products. This slider sets the amount of these emissions
        in the future year.
        <br/><br/> In the 'Common Reporting Tables (CRT)' developed by the UNFCCC these emissions are included in
        category: 2.B excl. 2.B.1, 2.B.2, 2.B.8.a and 2.B.10.a.
    emissions_industry_fertilizers_non_energetic_other_ghg:
      title: Fertilizers
      short_description: ''
      description: |
        In the fertilizer industry other greenhouse gases are emitted in non-energetic processes.
        Especially the production of nitric acid causes the emission of nitrous oxide (N<sub>2</sub>O).
        This slider sets the amount of these emissions in the future year.
        <br/><br/> In the 'Common Reporting Tables (CRT)' developed by the UNFCCC these emissions are included in
        category: 2.B.1, 2.B.2.
    emissions_industry_food_non_energetic_co2:
      title: Food
      short_description: ''
      description: |
        In the food industry CO<sub>2</sub> is emitted in non-energetic processes.
        This slider sets the amount of these emissions in the future year.
        <br/><br/> In the 'Common Reporting Tables (CRT)' developed by the UNFCCC these emissions are included in
        category: 2.H.2.
    emissions_industry_food_non_energetic_other_ghg:
      title: Food
      short_description: ''
      description: |
        In the food industry other greenhouse gases are emitted in non-energetic processes.
        This slider sets the amount of these emissions in the future year.
        <br/><br/> In the 'Common Reporting Tables (CRT)' developed by the UNFCCC these emissions are included in
        category: 2.H.2.
    emissions_industry_non_specified_energetic_other_ghg:
      title: Industry
      short_description: ''
      description: |
        Apart from the large amount of CO<sub>2</sub> emitted as a result of energy use in a
        number of industrial processes, relatively small amounts of methane (CH<sub>4</sub>) or nitrous oxide (N<sub>2</sub>O)
        can be released. This slider sets the amount of these emissions in the future year.
        <br/><br/> In the 'Common Reporting Tables (CRT)' developed by the UNFCCC these emissions are included in
        category: 1.A.2.
    emissions_industry_other_metals_non_energetic_co2:
      title: Other metals
      short_description: ''
      description: |
        During the production of metals other than steel and aluminium, such as ferroalloys, lead and zinc,
        CO<sub>2</sub> is emitted in non-energetic processes. This slider sets the amount of these emissions
        in the future year.
        <br/><br/> In the 'Common Reporting Tables (CRT)' developed by the UNFCCC these emissions are included in
        category: 2.C excl. 2.C.1 and 2.C.3.
    emissions_industry_other_metals_non_energetic_other_ghg:
      title: Other metals
      short_description: ''
      description: |
        During the production of metals other than steel and aluminium other greenhouse gases are emitted
        in non-energetic processes, for example sulphur hexafluoride (SF<sub>6</sub>) used in magnesium production.
        This slider sets the amount of these emissions in the future year.
        <br/><br/> In the 'Common Reporting Tables (CRT)' developed by the UNFCCC these emissions are included in
        category: 2.C excl. 2.C.1 and 2.C.3.
    emissions_industry_other_non_energetic_co2:
      title: Other industry
      short_description: ''
      description: |
        The production of minerals, electronics and all other products are part of the
        category 'other' industry. Especially in the mining industry and production of minerals (e.g. cement) CO<sub>2</sub>
        is emitted. This slider sets the amount of these emissions in the future year.
        <br/><br/> In the 'Common Reporting Tables (CRT)' developed by the UNFCCC these emissions are included in
        category: 2.A, 2.D to 2.G.
    emissions_industry_other_non_energetic_other_ghg:
      title: Other industry
      short_description: ''
      description: |
        In industrial sectors a large variety of greenhouse gases is emitted. For example
        during the production of coolants for refrigerators and to a lesser extent in the production of electronics
        or paraffin wax. This slider sets the amount of these emissions in the future year.
        <br/><br/> In the 'Common Reporting Tables (CRT)' developed by the UNFCCC these emissions are included in
        category: 2.A, 2.D to 2.G.
    emissions_industry_paper_non_energetic_co2:
      title: Paper
      short_description: ''
      description: |
        In the paper industry CO<sub>2</sub> is emitted in non-energetic processes.
        This slider sets the amount of these emissions in the future year.
        <br/><br/> In the 'Common Reporting Tables (CRT)' developed by the UNFCCC these emissions are included in
        category: 2.H.1.
    emissions_industry_paper_non_energetic_other_ghg:
      title: Paper
      short_description: ''
      description: |
        In the paper industry other greenhouse gases are emitted in non-energetic processes.
        This slider sets the amount of these emissions in the future year.
        <br/><br/> In the 'Common Reporting Tables (CRT)' developed by the UNFCCC these emissions are included in
        category: 2.H.1.
    emissions_industry_refineries_energetic_other_ghg:
      title: Refineries
      short_description: ''
      description: |
        During the combustion of fuels in refineries, methane (CH<sub>4</sub>) and nitrous
        oxide (N<sub>2</sub>O) are emitted. This slider sets the amount of these emissions in the future year.
        <br/><br/> In the 'Common Reporting Tables (CRT)' developed by the UNFCCC these emissions are included in
        category: 1.A.1.b.
    emissions_industry_refineries_non_energetic_other_ghg:
      title: Refineries
      short_description: ''
      description: |
        In refineries other greenhouse gases are emitted in non-energetic processes.
        This slider sets the amount of these emissions in the future year.
        <br/><br/> In the 'Common Reporting Tables (CRT)' developed by the UNFCCC these emissions are included in
        category: 1.B.2.a.iv.
    emissions_industry_steel_non_energetic_co2:
      title: Steel
      short_description: ''
      description: |
        During the production of iron and steel CO<sub>2</sub> is emitted in non-energetic processes,
        for example due to the use of limestone. This slider sets the amount of these emissions in the future year.
        <br/><br/> In the 'Common Reporting Tables (CRT)' developed by the UNFCCC these emissions are included in
        category: 2.C.1.
    emissions_industry_steel_non_energetic_other_ghg:
      title: Steel
      short_description: ''
      description: |
        During the production of iron and steel other greenhouse gases, such as methane (CH<sub>4</sub>),
        are emitted in non-energetic processes. This slider sets the amount of these emissions in the future year.
        <br/><br/> In the 'Common Reporting Tables (CRT)' developed by the UNFCCC these emissions are included in
        category: 2.C.1.
    # Agriculture
    emissions_agriculture_non_specified_energetic_other_ghg:
      title: Agriculture
      short_description: ''
      description: |
        In agriculture and fisheries there are many processes requiring energy.
        The use of machines, (greenhouse)lighting or heating of crops are all examples. Both nitrous oxide
        (N<sub>2</sub>O) and methane (CH<sub>4</sub>) are released during these processes.
        This slider sets the amount of these emissions in the future year.
        <br/><br/> In the 'Common Reporting Tables (CRT)' developed by the UNFCCC these emissions are included in
        category: 1.A.4.c.
    emissions_agriculture_non_specified_non_energetic_co2:
      title: Agriculture
      short_description: ''
      description: |
        In agriculture CO<sub>2</sub> is emitted in non-energetic processes such as the use of
        manure and fertilizer, and soil cultivation. In Europe especially the use of lime to counter soil
        acidification is a source of CO<sub>2</sub>.
        This slider sets the amount of these emissions in the future year.
        <br/><br/> In the 'Common Reporting Tables (CRT)' developed by the UNFCCC these emissions are included in
        category: 3.
    emissions_agriculture_non_specified_non_energetic_other_ghg:
      title: Agriculture
      short_description: ''
      description: |
        In agriculture other greenhouse gases are emitted in non-energetic processes. Examples are
        methane (CH<sub>4</sub>) released during (enteric) fermentation in livestock and from manure, and nitrous
        oxide (N<sub>2</sub>O) from soil cultivation and the fermentation of biomass.
        This slider sets the amount of these emissions in the future year.
        <br/><br/> In the 'Common Reporting Tables (CRT)' developed by the UNFCCC these emissions are included in
        category: 3.
    # Other
    emissions_other_non_specified_energetic_other_ghg:
      title: Other
      short_description: ''
      description: |
        During the combustion of fuels in other sectors, such as military use, methane (CH<sub>4</sub>)
        and nitrous oxide (N<sub>2</sub>O) are emitted. This slider sets the amount of these emissions in the future year.
        <br/><br/> In the 'Common Reporting Tables (CRT)' developed by the UNFCCC these emissions are included in
        category: 1.A.5.
    emissions_other_other_transportation_energetic_other_ghg:
      title: Other transportation
      short_description: ''
      description: |
        During the combustion of fuels for other transportation, such as pipeline transport,
        methane (CH<sub>4</sub>) and nitrous oxide (N<sub>2</sub>O) are emitted. This slider sets the amount of these emissions
        in the future year.
        <br/><br/> In the 'Common Reporting Tables (CRT)' developed by the UNFCCC these emissions are included in
        category: 1.A.3.e.
    # Energy
    emissions_energy_ccus_non_energetic_co2:
      title: CCUS
      short_description: ''
      description: |
        During the transport and storage of CO<sub>2</sub>, CO<sub>2</sub> can leak and be emitted.
        This slider sets the amount of these emissions in the future year.
        <br/><br/> In the 'Common Reporting Tables (CRT)' developed by the UNFCCC these emissions are included in
        category: 1.C.
    emissions_energy_electricity_and_heat_production_energetic_other_ghg:
      title: Electricity and heat production
      short_description: ''
      description: |
        During the production of electricity and heat the greenhouse gases methane (CH<sub>4</sub>) or
        nitrous oxide (N<sub>2</sub>O) are released. This slider sets the amount of these emissions in the future year.
        <br/><br/> In the 'Common Reporting Tables (CRT)' developed by the UNFCCC these emissions are included in
        category: 1.A.1.a.
    emissions_energy_fuels_production_energetic_other_ghg:
      title: Fuels production
      short_description: ''
      description: |
        During the production of fuels, such as coke and solid fuels, the greenhouse gases methane (CH<sub>4</sub>) or
        nitrous oxide (N<sub>2</sub>O) are released. This slider sets the amount of these emissions in the future year.
        <br/><br/> In the 'Common Reporting Tables (CRT)' developed by the UNFCCC these emissions are included in
        category: 1.A.1.c.
    emissions_energy_fugitive_emissions_non_energetic_co2:
      title: Fugitive emissions
      short_description: ''
      description: |
        During the extraction, processing, storage and transport of fuels CO<sub>2</sub> can escape,
        for example through leaks or flaring. This slider sets the amount of these emissions in the future year.
        <br/><br/> In the 'Common Reporting Tables (CRT)' developed by the UNFCCC these emissions are included in
        category: 1.B excl. 1.B.2.a.iv.
    emissions_energy_fugitive_emissions_non_energetic_other_ghg:
      title: Fugitive emissions
      short_description: ''
      description: |
        During the extraction, processing, storage and transport of fuels methane (CH<sub>4</sub>) can escape,
        for example through leaks in gas networks or from coal mines. This slider sets the amount of these emissions
        in the future year.
        <br/><br/> In the 'Common Reporting Tables (CRT)' developed by the UNFCCC these emissions are included in
        category: 1.B excl. 1.B.2.a.iv.
    emissions_energy_hydrogen_production_non_energetic_other_ghg:
      title: Hydrogen production
      short_description: ''
      description: |
        During the production of hydrogen other greenhouse gases are emitted in non-energetic processes.
        This slider sets the amount of these emissions in the future year.
        <br/><br/> In the 'Common Reporting Tables (CRT)' developed by the UNFCCC these emissions are included in
        category: 2.B.10.a.
    emissions_energy_methanol_production_non_energetic_other_ghg:
      title: Methanol production
      short_description: ''
      description: |
        During the production of methanol other greenhouse gases are emitted in non-energetic processes.
        This slider sets the amount of these emissions in the future year.
        <br/><br/> In the 'Common Reporting Tables (CRT)' developed by the UNFCCC these emissions are included in
        category: 2.B.8.a.
    # Waste
    emissions_waste_non_specified_non_energetic_co2:
      title: Waste
      short_description: ''
      description: |
        During the management of waste CO<sub>2</sub> can be emitted. For example during the incineration
        of waste without energy recovery. This slider sets the amount of these emissions in the future year.
        <br/><br/> In the 'Common Reporting Tables (CRT)' developed by the UNFCCC these emissions are included in
        category: 5.
    emissions_waste_non_specified_non_energetic_other_ghg:
      title: Waste
      short_description: ''
      description: |
        Waste dumping and the management of solid waste often causes the release of methane (CH<sub>4</sub>).
        To a lesser extent the management of waste water causes the release of methane and nitrous oxide (N<sub>2</sub>O).
        This slider sets the amount of these emissions in the future year.
        <br/><br/> In the 'Common Reporting Tables (CRT)' developed by the UNFCCC these emissions are included in
        category: 5.
    # LULUCF
    emissions_lulucf_non_energetic_co2:
      title: LULUCF
      short_description: ''
      description: |
        Land use, land-use change and forestry (LULUCF) can both emit and absorb CO<sub>2</sub>, for example
        through the drainage of peatlands, deforestation or the growth of forests. This slider sets the amount of these emissions
        in the future year.
        <br/><br/> In the 'Common Reporting Tables (CRT)' developed by the UNFCCC these emissions are included in
        category: 4.
    emissions_lulucf_non_energetic_other_ghg:
      title: LULUCF
      short_description: ''
      description: |
        Land use, land-use change and forestry (LULUCF) can cause the emission of other greenhouse gases,
        such as methane (CH<sub>4</sub>) and nitrous oxide (N<sub>2</sub>O) from drained organic soils or wildfires.
        This slider sets the amount of these emissions in the future year.
        <br/><br/> In the 'Common Reporting Tables (CRT)' developed by the UNFCCC these emissions are included in
        category: 4.
    # Indirect emissions
    emissions_other_indirect_emissions_non_energetic_co2:
      title: Indirect emissions
      short_description: ''
      description: |
        ‘Indirect emissions’ are CO<sub>2</sub> emissions caused by the atmospheric oxidation of methane (CH<sub>4</sub>),
        carbon monoxide (CO) and Non-Methane Volatile Organic Compounds (NMVOC). These emissions have a large number of causes and can be emitted
        by any sector.
        This slider sets the amount of these emissions in the future year.
        <br/><br/> In the 'Common Reporting Tables (CRT)' developed by the UNFCCC these emissions are classified as 'ind_CO2'.
